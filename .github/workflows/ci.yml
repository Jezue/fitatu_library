name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit; Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-commit
        run: pre-commit run --all-files

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src demo.py example.py catering_sync.py

      - name: Build package
        run: python -m build

      - name: Upload built artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  test:
    # Every supported Python on Linux; one on macOS and Windows for paths, file modes and time zones.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # also on Windows, so a failing command stops the step
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov=fitatu_api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  docker:
    # The image builds and answers with the token; nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t fitatu-mcp:ci .

      - name: Smoke test
        # Polls with curl, as Docker runs the first health check only after its 30 s interval;
        # without -f a 401 counts as up. --demo: no Fitatu calls.
        run: |
          token=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name fitatu-mcp -e FITATU_MCP_TOKEN="$token" -p 127.0.0.1:8765:8765 fitatu-mcp:ci --demo
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8765/mcp && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/mcp)" = 401
          curl -sSf -X POST http://127.0.0.1:8765/mcp -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_today","arguments":{}}}' \
            | grep -q '"ok": *true'
          ! docker logs fitatu-mcp 2>&1 | grep -qF "$token"

      - name: Server log
        if: failure()
        run: docker logs fitatu-mcp
