name: Release

# Pushing a tag vX.Y.Z runs the checks, builds the sdist and the wheel, publishes them to PyPI
# through trusted publishing (no API token in the repository) and then lists server.json in the
# MCP Registry. One-time setup and the steps: docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" twine

      # PyPI never takes a version twice, so nothing is built from a commit that fails the checks.
      - name: Lint and test
        run: |
          ruff check .
          mypy src demo.py example.py catering_sync.py
          pytest -q

      - name: Build
        run: python -m build

      - name: Check that the tag is the package version
        run: |
          version=$(unzip -p dist/*.whl '*.dist-info/METADATA' | sed -n 's/^Version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version (fitatu_api.__version__)."
            exit 1
          fi

      - name: Check the package metadata
        run: python -m twine check --strict dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fitatu-api
    permissions:
      id-token: write  # PyPI accepts this job's OIDC token in place of an API token
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    # The package is on PyPI by now; a registry failure is fixed by re-running this job.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write  # mcp-publisher logs in to the registry with this job's GitHub OIDC token
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The registry checks the package on PyPI (its README must name the server), and a new
      # release can take a few minutes to show up there.
      - name: Wait for the release on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            curl -sSf -o /dev/null "https://pypi.org/pypi/fitatu-api/${version}/json" && exit 0
            sleep 10
          done
          echo "::error::fitatu-api ${version} is not on PyPI after 5 minutes."
          exit 1

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
