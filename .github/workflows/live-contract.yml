name: Live contract

# Weekly check that Fitatu still answers the way the recording and the library expect, before
# users find out: scripts/check_contract.py compares the structure of every read route's reply
# with tests/fixtures/, then the read-only live tests run. Both only read, with the session in
# the FITATU_SESSION_JSON secret, which should be a throwaway account's (CONTRIBUTING.md). They
# print route and key names, never values; nothing is uploaded. Without the secret the run
# ends with a notice and succeeds.
on:
  schedule:
    - cron: "23 5 * * 1"  # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.secret.outputs.present }}
    steps:
      - name: Look for the session secret
        id: secret
        env:
          FITATU_SESSION_JSON: ${{ secrets.FITATU_SESSION_JSON }}
        run: |
          if [ -n "$FITATU_SESSION_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Live contract skipped::No FITATU_SESSION_JSON secret. Set it to a throwaway account's \`fitatu-api login --print\` to run this check (CONTRIBUTING.md)."
          fi

  check:
    needs: session
    if: needs.session.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mask the account id and tokens in the log
        env:
          FITATU_SESSION_JSON: ${{ secrets.FITATU_SESSION_JSON }}
        run: |
          python3 - <<'EOF'
          import json, os
          session = json.loads(os.environ["FITATU_SESSION_JSON"])
          for key in ("fitatu_user_id", "bearer_token", "refresh_token"):
              if session.get(key):
                  print(f"::add-mask::{session[key]}")
          EOF

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # The secret is not in the environment here: install scripts never see it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compare the API's replies with the recording
        env:
          FITATU_SESSION_JSON: ${{ secrets.FITATU_SESSION_JSON }}
        run: python scripts/check_contract.py

      - name: Read-only live tests
        if: ${{ !cancelled() }}
        env:
          FITATU_SESSION_JSON: ${{ secrets.FITATU_SESSION_JSON }}
          FITATU_RUN_LIVE_TESTS: "1"
        # --assert=plain: pytest's assertion rewriting would print the values an assert compared.
        run: pytest tests/test_live_all.py -k ReadOnly --assert=plain --tb=short --no-cov -p no:cacheprovider
