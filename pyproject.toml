[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fitatu-api"
dynamic = ["version"]
description = "Unofficial Python API client for Fitatu — built for AI agents and automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Adam Gajewski" }
]
keywords = ["fitatu", "calorie", "nutrition", "meal-planner", "api", "mcp", "llm", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.31.0",
  # zoneinfo has no time zone database on Windows; get_today needs the account's zone.
  "tzdata; sys_platform == 'win32'",
]

[project.scripts]
fitatu-api = "fitatu_api.__main__:main"
fitatu-mcp = "fitatu_api.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Jezue/fitatu_library"
Documentation = "https://github.com/Jezue/fitatu_library/tree/main/docs"
Source = "https://github.com/Jezue/fitatu_library"
Issues = "https://github.com/Jezue/fitatu_library/issues"
Changelog = "https://github.com/Jezue/fitatu_library/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# fitatu-mcp, the MCP server: written for the 2.x API and tested with 2.3.
mcp = [
  "mcp>=2.3,<3",
]
dev = [
  "mcp>=2.3,<3",
  "hatch>=1.12",
  "mypy>=1.11",
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-requests>=2.32",
  "pre-commit>=3.8",
  "codespell>=2.3",
]

[tool.hatch.version]
# Bump __version__ there: it is the only place the version is set.
path = "src/fitatu_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fitatu_api"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/docs",
  "/server.json",
]

[tool.hatch.envs.default]
# The scripts below need the dev tools (ruff, mypy, pytest, build) in hatch's environment.
features = ["dev"]

[tool.hatch.envs.default.scripts]
# Lint fixes only: the code is not kept in ruff format style, and neither CI nor pre-commit checks it.
format = "ruff check . --fix"
lint = "ruff check . && mypy src demo.py example.py"
test = "pytest -q"
testcov = "pytest -q --cov-report=html"
typecheck = "mypy src demo.py example.py"
# Lint, tests and the package build in one command: hatch run all
all = ["lint", "test", "python -m build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=fitatu_api --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["fitatu_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
