repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # Block style on purpose: in a [flow, list] the commas inside --skip split it into items.
        # hevy (fitness app) and bloc (Flutter state library) appear in the app API catalog;
        # produkt and ser (cheese) are Polish, in the MCP prompts and the demo diary.
        args:
          - --skip=dist,.git,.mypy_cache,.pytest_cache,.ruff_cache
          - --ignore-words-list=hevy,bloc,produkt,ser
